version: '3.8'
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: arca_vectordb
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: arca
    ports:
      - "5432:5432"
    volumes:
      - arca_pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: arca_adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  arca_pgdata:
